[project]
name = "pythonoramix"
version = "0.1.0"
description = "Kata d'architecture hexagonale au pays des irréductibles développeurs, en Python"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pythonoramix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytestarch>=5.1.0",
    "ruff>=0.17.4",
]
